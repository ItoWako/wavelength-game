<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>WAVELENGTH</title><style>:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#222;--muted:#777169;--accent:#ff6b4a;--shadow:0 10px 28px rgba(0,0,0,.09)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100svh;padding:16px}.app{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;letter-spacing:.08em;font-size:14px}.step{font-size:12px;color:var(--muted)}.scores{display:flex;gap:8px;margin-bottom:12px}.player{flex:1;background:#fffdf8;border-radius:16px;padding:10px 12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05)}.player.active{outline:2px solid var(--accent)}.player b{display:block;font-size:22px}.player small{color:var(--muted)}.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow)}h1{font-size:38px;line-height:1.05;margin:0 0 14px}h2{font-size:28px;margin:0 0 12px}.lead{color:var(--muted);line-height:1.7}.screen{display:none}.screen.active{display:block}.btn{width:100%;display:block;text-align:center;text-decoration:none;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:800;min-height:54px;padding:16px 14px;margin-top:14px;touch-action:manipulation}.btn.secondary{background:#ece7df;color:var(--ink)}.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f0ece5;border-radius:18px;padding:16px;margin:18px 0;font-weight:800}.topic span:first-child,.topic span:last-child{width:36%}.topic span:last-child{text-align:right}.arrow{width:28%;text-align:center;color:var(--muted)}.secret{background:#222;color:#fff;border-radius:20px;padding:18px;text-align:center;margin:18px 0}.secret strong{display:block;font-size:40px;margin-top:6px}.track{position:relative;height:30px;border-radius:999px;background:linear-gradient(90deg,#cfe8ff,#f7e2a0,#ffc7ba);margin:22px 0}.marker,.needle{position:absolute;top:50%;transform:translate(-50%,-50%);width:24px;height:44px;border-radius:12px}.marker{background:var(--accent);outline:6px solid rgba(255,107,74,.15)}.needle{background:#222}.range-row{display:flex;gap:10px;align-items:center}input[type=range]{width:100%}.percent{min-width:58px;text-align:center;font-weight:900;background:#eee9e1;border-radius:12px;padding:8px}.center{text-align:center}.big{font-size:58px}.score{display:flex;justify-content:space-between;align-items:center;background:#f0ece5;border-radius:18px;padding:16px;margin:12px 0}.score strong{font-size:30px}.turn{font-weight:900;color:var(--accent);margin-bottom:8px}</style></head><body><div class="app"><div class="top"><div class="brand">WAVELENGTH</div><div class="step" id="step">START</div></div><div class="scores" id="scoreboard"><div class="player" id="p1box"><small>PLAYER 1</small><b id="p1score">0</b></div><div class="player" id="p2box"><small>PLAYER 2</small><b id="p2score">0</b></div></div><section class="card screen active" id="start"><div class="big">〰️</div><h1>ふたりの感覚、<br>どこまで合う？</h1><p class="lead">2人で交互に出題します。回答者が正解に近づくほどポイント獲得！</p><button class="btn" id="startBtn">WAVELENGTHをはじめる</button><a class="btn secondary" href="who/">👉 どっちが〇〇？で遊ぶ</a></section><section class="card screen" id="topic"><div class="turn" id="turnTopic"></div><h2>今回のお題</h2><div class="topic"><span id="l1"></span><span class="arrow">←──→</span><span id="r1"></span></div><p class="lead">次の画面は出題者だけ見てください。</p><button class="btn" id="secretBtn">出題者だけ正解を見る</button></section><section class="card screen" id="secret"><div class="turn" id="turnSecret"></div><h2>出題者の秘密</h2><div class="secret">正解の位置<strong id="targetText"></strong></div><div class="topic"><span id="l2"></span><span class="arrow">←──→</span><span id="r2"></span></div><div class="track"><div class="marker" id="secretMarker"></div></div><p class="lead">この位置を連想するヒントを口頭で伝えて、スマホを回答者に渡してください。</p><button class="btn" id="passBtn">回答者に渡す</button></section><section class="card screen" id="pass"><div class="center"><div class="big">🙈</div><h2 id="passTitle">回答者に交代！</h2><p class="lead">正解位置は隠れました。</p></div><button class="btn" id="guessStartBtn">回答をはじめる</button></section><section class="card screen" id="guess"><div class="turn" id="turnGuess"></div><h2>どのへんだと思う？</h2><div class="topic"><span id="l3"></span><span class="arrow">←──→</span><span id="r3"></span></div><div class="track"><div class="needle" id="needle"></div></div><div class="range-row"><input type="range" id="range" min="0" max="100" value="50"><div class="percent"><span id="rangeText">50</span>%</div></div><button class="btn" id="revealBtn">ここで決定・正解発表</button></section><section class="card screen" id="result"><div class="center"><div class="big" id="emoji">🎯</div><h2 id="resultTitle">結果</h2></div><div class="topic"><span id="l4"></span><span class="arrow">←──→</span><span id="r4"></span></div><div class="track"><div class="marker" id="finalTarget"></div><div class="needle" id="finalGuess"></div></div><div class="score"><span>ズレ</span><strong><span id="diff">0</span>%</strong></div><div class="score"><span id="pointOwner">獲得ポイント</span><strong>+<span id="pts">4</span> pt</strong></div><button class="btn" id="nextBtn">役割を交代して次のお題へ</button><button class="btn secondary" id="homeBtn">スコアをリセット</button></section></div><script>(function(){var topics=[["全然怖くない","めちゃくちゃ怖い"],["安っぽい","高級"],["朝に食べたい","夜に食べたい"],["友達になりたくない","友達になりたい"],["テンションが下がる","テンションが上がる"],["子どもっぽい","大人っぽい"],["地味","派手"],["デート向きじゃない","デート向き"],["一人でやりたい","みんなでやりたい"],["まずい","めちゃくちゃ美味しい"],["絶対にほしくない","めちゃくちゃほしい"],["退屈","最高に楽しい"],["恋人にされても平気","恋人にされたら嬉しい"],["脈なしっぽい","脈ありっぽい"],["友達っぽいデート","恋人っぽいデート"],["記念日には微妙","記念日に最高"],["嫉妬しない","めちゃくちゃ嫉妬する"],["付き合いたてっぽい","長年付き合ってるっぽい"]],current,target,scores=[0,0],answerer=1;function $(x){return document.getElementById(x)}function show(id,s){document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});$(id).classList.add('active');$('step').textContent=s;scrollTo(0,0)}function updateScore(){ $('p1score').textContent=scores[0];$('p2score').textContent=scores[1];$('p1box').classList.toggle('active',answerer===0);$('p2box').classList.toggle('active',answerer===1)}function labels(){['l1','l2','l3','l4'].forEach(x=>$(x).textContent=current[0]);['r1','r2','r3','r4'].forEach(x=>$(x).textContent=current[1])}function roles(){var giver=answerer===0?2:1,ans=answerer+1;$('turnTopic').textContent='PLAYER '+giver+' が出題';$('turnSecret').textContent='PLAYER '+giver+' だけ見てね';$('turnGuess').textContent='PLAYER '+ans+' の回答';$('passTitle').textContent='PLAYER '+ans+' に交代！'}function round(){current=topics[Math.floor(Math.random()*topics.length)];target=Math.floor(Math.random()*91)+5;labels();roles();updateScore();$('targetText').textContent=target+'%';$('secretMarker').style.left=target+'%';$('range').value=50;$('rangeText').textContent=50;$('needle').style.left='50%';show('topic','1 / 4')}function points(d){return d<=5?4:d<=10?3:d<=20?2:d<=30?1:0}$('startBtn').onclick=function(){scores=[0,0];answerer=1;round()};$('secretBtn').onclick=function(){show('secret','2 / 4')};$('passBtn').onclick=function(){show('pass','3 / 4')};$('guessStartBtn').onclick=function(){show('guess','3 / 4')};$('range').oninput=function(){$('rangeText').textContent=this.value;$('needle').style.left=this.value+'%'};$('revealBtn').onclick=function(){var g=+$('range').value,d=Math.abs(g-target),p=points(d);scores[answerer]+=p;updateScore();$('finalTarget').style.left=target+'%';$('finalGuess').style.left=g+'%';$('diff').textContent=d;$('pts').textContent=p;$('pointOwner').textContent='PLAYER '+(answerer+1)+' の獲得';if(p===4){$('resultTitle').textContent='ほぼ完全一致！';$('emoji').textContent='🎯'}else if(p===3){$('resultTitle').textContent='かなり近い！';$('emoji').textContent='✨'}else if(p===2){$('resultTitle').textContent='いい線いってる！';$('emoji').textContent='👏'}else if(p===1){$('resultTitle').textContent='ちょっと近い！';$('emoji').textContent='🙂'}else{$('resultTitle').textContent='けっこうズレた！';$('emoji').textContent='🌊'}show('result','4 / 4')};$('nextBtn').onclick=function(){answerer=answerer===0?1:0;round()};$('homeBtn').onclick=function(){scores=[0,0];answerer=1;updateScore();show('start','START')}updateScore()})();</script></body></html>
