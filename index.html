<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WAVELENGTH</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#222;--muted:#777169;--line:#d9d2c8;--accent:#ff6b4a;--shadow:0 10px 28px rgba(0,0,0,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}body{min-height:100svh;padding:16px}.app{width:100%;max-width:720px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;letter-spacing:.08em;font-size:14px}.step{font-size:12px;color:var(--muted)}.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04)}h1{font-size:38px;line-height:1.05;margin:0 0 14px}h2{font-size:28px;margin:0 0 12px}p{line-height:1.7}.lead{color:var(--muted)}.screen{display:none}.screen.active{display:block}.btn{width:100%;display:block;border:none;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:800;min-height:54px;padding:14px 18px;margin-top:14px;-webkit-appearance:none;appearance:none;touch-action:manipulation}.btn.secondary{background:#ece7df;color:var(--ink)}.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f0ece5;border-radius:18px;padding:16px;margin:18px 0;font-weight:800}.topic span:first-child,.topic span:last-child{width:36%}.topic span:last-child{text-align:right}.arrow{width:28%;text-align:center;color:var(--muted)}.secret{background:#222;color:#fff;border-radius:20px;padding:18px;text-align:center;margin:18px 0}.secret strong{display:block;font-size:40px;margin-top:6px}.track{position:relative;height:30px;border-radius:999px;background:linear-gradient(90deg,#cfe8ff,#f7e2a0,#ffc7ba);margin:18px 0}.marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:24px;height:44px;border-radius:12px;background:var(--accent);outline:6px solid rgba(255,107,74,.15)}.needle{position:absolute;top:50%;transform:translate(-50%,-50%);width:22px;height:42px;border-radius:11px;background:#222}input[type="text"]{width:100%;font-size:17px;padding:15px;border-radius:16px;border:1px solid var(--line);background:#fff}input[type="range"]{width:100%;touch-action:pan-x}.range-row{display:flex;gap:10px;align-items:center}.percent{min-width:58px;text-align:center;font-weight:900;background:#eee9e1;border-radius:12px;padding:8px}.center{text-align:center}.big{font-size:58px}.score{display:flex;justify-content:space-between;align-items:center;background:#f0ece5;border-radius:18px;padding:16px;margin:12px 0}.score strong{font-size:30px}.small{font-size:12px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="brand">WAVELENGTH</div><div class="step" id="step">START</div></div>
<section class="card screen active" id="start"><div class="big">〰️</div><h1>感覚を、<br>どこまで合わせられる？</h1><p class="lead">出題者がヒントを出し、相手が正解の位置を予想するゲームです。</p><button class="btn" type="button" id="startBtn">ゲームをはじめる</button><p class="small">iPhone・Safari対応。スマホ1台を順番に回して遊べます。</p></section>
<section class="card screen" id="topic"><h2>今回のお題</h2><div class="topic"><span id="l1"></span><span class="arrow">←──→</span><span id="r1"></span></div><p class="lead">次の画面は出題者だけ見てください。</p><button class="btn" type="button" id="secretBtn">出題者だけ正解を見る</button></section>
<section class="card screen" id="secret"><h2>出題者の秘密</h2><div class="secret">正解の位置<strong id="targetText">50%</strong></div><div class="topic"><span id="l2"></span><span class="arrow">←──→</span><span id="r2"></span></div><div class="track"><div class="marker" id="secretMarker"></div></div><input type="text" id="hintInput" placeholder="ヒントを入力 例：夜の学校"><button class="btn" type="button" id="lockBtn">ヒントを決定して渡す</button></section>
<section class="card screen" id="pass"><div class="center"><div class="big">🙈</div><h2>画面を相手に渡してね</h2><p class="lead">正解位置はもう見えません。</p></div><button class="btn" type="button" id="guessStartBtn">回答をはじめる</button></section>
<section class="card screen" id="guess"><h2>どのへんだと思う？</h2><div class="topic"><span id="l3"></span><span class="arrow">←──→</span><span id="r3"></span></div><p class="lead">ヒント：<strong id="hintShow"></strong></p><div class="track"><div class="needle" id="needle"></div></div><div class="range-row"><input type="range" id="range" min="0" max="100" value="50"><div class="percent"><span id="rangeText">50</span>%</div></div><button class="btn" type="button" id="revealBtn">ここで決定・正解発表</button></section>
<section class="card screen" id="result"><div class="center"><div class="big" id="emoji">🎯</div><h2 id="resultTitle">結果</h2></div><div class="topic"><span id="l4"></span><span class="arrow">←──→</span><span id="r4"></span></div><p class="lead">ヒント：<strong id="resultHint"></strong></p><div class="track"><div class="marker" id="finalTarget"></div><div class="needle" id="finalGuess"></div></div><div class="score"><span>ズレ</span><strong><span id="diff">0</span>%</strong></div><div class="score"><span>ポイント</span><strong><span id="pts">4</span> pt</strong></div><button class="btn" type="button" id="nextBtn">次のお題へ</button><button class="btn secondary" type="button" id="homeBtn">最初に戻る</button></section></div>
<script>
(function(){var topics=[["全然怖くない","めちゃくちゃ怖い"],["安っぽい","高級"],["朝に食べたい","夜に食べたい"],["友達になりたくない","友達になりたい"],["テンションが下がる","テンションが上がる"],["子どもっぽい","大人っぽい"],["地味","派手"],["デート向きじゃない","デート向き"],["一人でやりたい","みんなでやりたい"],["まずい","めちゃくちゃ美味しい"],["絶対にほしくない","めちゃくちゃほしい"],["退屈","最高に楽しい"]];var current=["",""],target=50,hint="";function $(id){return document.getElementById(id)}function show(id,step){var screens=document.querySelectorAll(".screen");for(var i=0;i<screens.length;i++){screens[i].className="card screen"}$(id).className="card screen active";$("step").textContent=step;window.scrollTo(0,0)}function setLabels(){["l1","l2","l3","l4"].forEach(function(id){$(id).textContent=current[0]});["r1","r2","r3","r4"].forEach(function(id){$(id).textContent=current[1]})}function newRound(){current=topics[Math.floor(Math.random()*topics.length)];target=Math.floor(Math.random()*91)+5;hint="";setLabels();$("targetText").textContent=target+"%";$("secretMarker").style.left=target+"%";$("hintInput").value="";$("range").value=50;$("rangeText").textContent="50";$("needle").style.left="50%";show("topic","1 / 5")}function score(d){if(d<=5)return 4;if(d<=10)return 3;if(d<=20)return 2;if(d<=30)return 1;return 0}$("startBtn").addEventListener("click",newRound);$("secretBtn").addEventListener("click",function(){show("secret","2 / 5")});$("lockBtn").addEventListener("click",function(){hint=$("hintInput").value.trim();if(!hint){$("hintInput").focus();return}show("pass","3 / 5")});$("guessStartBtn").addEventListener("click",function(){$("hintShow").textContent=hint;show("guess","4 / 5")});$("range").addEventListener("input",function(){$("rangeText").textContent=this.value;$("needle").style.left=this.value+"%"});$("revealBtn").addEventListener("click",function(){var g=parseInt($("range").value,10),d=Math.abs(g-target),p=score(d);$("finalTarget").style.left=target+"%";$("finalGuess").style.left=g+"%";$("diff").textContent=d;$("pts").textContent=p;$("resultHint").textContent=hint;if(p===4){$("resultTitle").textContent="ほぼ完全一致！";$("emoji").textContent="🎯"}else if(p===3){$("resultTitle").textContent="かなり近い！";$("emoji").textContent="✨"}else if(p===2){$("resultTitle").textContent="いい線いってる！";$("emoji").textContent="👏"}else if(p===1){$("resultTitle").textContent="ちょっと近い！";$("emoji").textContent="🙂"}else{$("resultTitle").textContent="けっこうズレた！";$("emoji").textContent="🌊"}show("result","5 / 5")});$("nextBtn").addEventListener("click",newRound);$("homeBtn").addEventListener("click",function(){show("start","START")})})();
</script>
</body>
</html>
