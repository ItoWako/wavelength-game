<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>どっちが〇〇？</title><style>:root{--bg:#f4f1ea;--ink:#222;--muted:#777169}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100dvh;padding:18px}.app{max-width:720px;margin:auto;min-height:calc(100dvh - 36px);display:grid;grid-template-rows:24px 1fr}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em;font-size:14px}.round{font-size:12px;color:var(--muted)}.stage{min-height:0;display:flex;align-items:center;justify-content:center;padding-bottom:24px}.screen{display:none;width:100%}.screen.active{display:block}.big{font-size:58px;text-align:center}.center{text-align:center}h1{font-size:38px;line-height:1.05;margin:0 0 14px}h2{font-size:30px;line-height:1.35;margin:0}.lead{color:var(--muted);line-height:1.7}.btn{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:800;min-height:54px;padding:14px;margin-top:18px}.question{font-size:36px;line-height:1.35;font-weight:900;text-align:center;padding:30px 4px}.count{font-size:82px;font-weight:900;text-align:center;line-height:1;padding:30px 0}.hint{font-size:18px;text-align:center;color:var(--muted);margin-top:16px}.players{display:flex;gap:12px;margin:22px 0}.pill{flex:1;background:#e9e4dc;border-radius:18px;padding:18px;text-align:center;font-weight:900;font-size:20px}.small{font-size:13px;color:var(--muted);text-align:center}.category{display:table;background:#e9e4dc;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--muted);margin:0 auto 12px}.back{display:block;text-align:center;margin-top:16px;color:var(--muted);text-decoration:none;font-size:14px}</style></head><body><main class="app"><div class="top"><div class="brand">GAMES FOR TWO</div><div class="round">どっちが〇〇？</div></div><div class="stage"><section class="screen active" id="start"><div class="big">👉👈</div><div class="center"><h1>どっちが〇〇？</h1><p class="lead">お題を見て、3・2・1で「自分」か「相手」を同時に指差すだけ。答えが違ったら理由も聞いてみよう。</p></div><button class="btn" id="startBtn">ゲームをはじめる</button><a class="back" href="../">← ゲーム一覧に戻る</a></section><section class="screen" id="question"><div class="category" id="category"></div><div class="question" id="questionText"></div><button class="btn" id="countBtn">3・2・1！</button></section><section class="screen" id="count"><div class="count" id="countText">3</div><div class="hint">0になったら同時に指差して！</div></section><section class="screen" id="reveal"><div class="big">👉</div><div class="center"><h2>せーの！</h2><p class="lead">2人とも「自分」か「相手」を指差してね。</p></div><div class="players"><div class="pill">PLAYER 1</div><div class="pill">PLAYER 2</div></div><p class="small" id="currentQuestion"></p><button class="btn" id="nextBtn">次のお題へ</button><a class="back" href="../">← ゲーム一覧に戻る</a></section></div></main><script>(function(){var questions=[{t:'どっちが先に寝落ちする？',c:'日常'},{t:'どっちが方向音痴？',c:'日常'},{t:'どっちが無人島で生き残れそう？',c:'もしも'},{t:'どっちが急に海外移住しそう？',c:'もしも'},{t:'どっちが秘密を隠すのが下手？',c:'性格'},{t:'どっちが買い物で悩む時間が長い？',c:'日常'},{t:'どっちが予定を忘れがち？',c:'日常'},{t:'どっちが朝に強い？',c:'日常'},{t:'どっちが甘いものを我慢できない？',c:'食べ物'},{t:'どっちが旅行の荷物が多い？',c:'旅行'},{t:'どっちが写真をたくさん撮る？',c:'旅行'},{t:'どっちが人見知り？',c:'性格'},{t:'どっちが笑いのツボが浅い？',c:'性格'},{t:'どっちがサプライズが得意？',c:'恋愛'},{t:'どっちが嫉妬深い？',c:'恋愛'},{t:'どっちが先に謝る？',c:'恋愛'},{t:'どっちが相手のことを好き？',c:'恋愛'},{t:'どっちが記念日をしっかり覚えてる？',c:'恋愛'},{t:'どっちがデートプランを考えるのが得意？',c:'恋愛'},{t:'どっちがケンカしたあと引きずる？',c:'恋愛'},{t:'どっちが将来についてよく考えてる？',c:'恋愛'},{t:'どっちがロマンチスト？',c:'恋愛'},{t:'どっちが相手を甘やかしてる？',c:'恋愛'},{t:'どっちがSNSを見てる時間が長い？',c:'日常'},{t:'どっちが運がいい？',c:'もしも'},{t:'どっちがゾンビの世界で先にピンチになる？',c:'もしも'},{t:'どっちが宝くじを当てそう？',c:'もしも'},{t:'どっちが有名人になりそう？',c:'もしも'},{t:'どっちが料理で大胆なアレンジをする？',c:'食べ物'},{t:'どっちが店員さんと仲良くなりやすい？',c:'性格'}],last=-1,n=0,current;function $(x){return document.getElementById(x)}function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});$(id).classList.add('active');scrollTo(0,0)}function pick(){var i;do{i=Math.floor(Math.random()*questions.length)}while(i===last&&questions.length>1);last=i;current=questions[i];n++;$('questionText').textContent=current.t;$('category').textContent=current.c;show('question')}function countdown(){show('count');var x=3;$('countText').textContent=x;var timer=setInterval(function(){x--;if(x>0){$('countText').textContent=x}else{clearInterval(timer);$('currentQuestion').textContent=current.t;show('reveal')}},650)}$('startBtn').onclick=function(){n=0;pick()};$('countBtn').onclick=countdown;$('nextBtn').onclick=pick})();</script></body></html>
