<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>歌ワード</title><style>:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#222;--muted:#777169;--shadow:0 10px 28px rgba(0,0,0,.09)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100svh;padding:16px}.app{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;letter-spacing:.08em;font-size:14px}.count{font-size:12px;color:var(--muted)}.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow);min-height:74svh;display:flex;flex-direction:column;justify-content:center}.icon{font-size:54px;text-align:center;margin-bottom:16px}.title{text-align:center;font-size:34px;margin:0 0 10px}.lead{text-align:center;color:var(--muted);line-height:1.7;margin:0 auto 28px;max-width:500px}.word-wrap{background:#f0ece5;border-radius:24px;min-height:180px;display:flex;align-items:center;justify-content:center;padding:26px;margin:8px 0 20px}.word{font-size:clamp(42px,13vw,72px);font-weight:900;letter-spacing:.03em;text-align:center}.btn{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:800;min-height:54px;padding:14px;margin-top:10px;touch-action:manipulation}.back{display:block;text-align:center;margin-top:16px;color:var(--muted);text-decoration:none;font-size:14px}.small{text-align:center;color:var(--muted);font-size:13px;margin-top:14px;line-height:1.6}</style></head><body><main class="app"><div class="top"><div class="brand">UTA WORD</div><div class="count" id="countLabel">START</div></div><section class="card"><div class="icon">🎤</div><h1 class="title">歌ワード</h1><p class="lead">表示された単語が歌詞に入っている曲を、誰より早く歌い始めよう。</p><div class="word-wrap"><div class="word" id="word">ボタンを押して<br>お題を生成しよう！</div></div><button class="btn" id="generateBtn">単語を生成する</button><p class="small">同じ単語が続かないようにランダムで出題します。</p><a class="back" href="../">← ゲーム一覧に戻る</a></section></main><script>(function(){var words=['愛','夢','夜','朝','空','海','雨','雪','風','星','月','太陽','光','影','声','涙','笑顔','心','恋','好き','君','僕','私','世界','未来','過去','今日','明日','昨日','春','夏','秋','冬','花','桜','道','街','駅','電車','車','家','部屋','窓','ドア','手','指','目','髪','名前','時間','時計','電話','写真','手紙','言葉','秘密','約束','キス','抱きしめる','会いたい','さよなら','ありがとう','ごめん','帰る','走る','歩く','飛ぶ','踊る','歌う','眠る','起きる','食べる','飲む','笑う','泣く','待つ','探す','忘れる','覚えてる','赤','青','白','黒','金','銀','虹','雲','波','川','山','森','火','水','音','匂い','温度','季節','運命','自由','希望','奇跡','幸せ','寂しい','優しい','強い','弱い','遠い','近い','長い','短い','永遠','一瞬'];var last=-1,n=0;function pick(){var i;do{i=Math.floor(Math.random()*words.length)}while(i===last&&words.length>1);last=i;n++;document.getElementById('word').textContent=words[i];document.getElementById('countLabel').textContent='Q'+n}document.getElementById('generateBtn').onclick=pick})();</script></body></html>
