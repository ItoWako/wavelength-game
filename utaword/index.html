<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>歌ワード</title><style>:root{--bg:#f4f1ea;--ink:#222;--muted:#777169}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100dvh;padding:18px}.app{max-width:720px;margin:auto;min-height:calc(100dvh - 36px);display:grid;grid-template-rows:24px 1fr}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em;font-size:14px}.count{font-size:12px;color:var(--muted)}.stage{min-height:0;display:flex;align-items:center;padding-bottom:24px}.game{width:100%}.icon{font-size:58px;margin-bottom:10px}.title{font-size:38px;line-height:1.05;margin:0 0 14px}.lead{color:var(--muted);line-height:1.7;margin:0 0 22px;max-width:520px}.eras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.era{border:0;background:#e9e4dc;color:var(--ink);font-size:13px;font-weight:800;padding:11px 8px;border-radius:999px}.era.active{background:var(--ink);color:#fff}.word-wrap{min-height:180px;display:flex;align-items:center;padding:18px 0;margin:6px 0 18px}.word{font-size:clamp(46px,14vw,76px);font-weight:900;line-height:1.2}.btn{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:800;min-height:54px;padding:14px;margin-top:10px}.back{display:block;margin-top:16px;color:var(--muted);text-decoration:none;font-size:14px}.small{color:var(--muted);font-size:13px;margin-top:12px;line-height:1.6}</style></head><body><main class="app"><div class="top"><div class="brand">GAMES FOR TWO</div><div class="count" id="countLabel">START</div></div><div class="stage"><section class="game"><div class="icon">🎤</div><h1 class="title">歌ワード</h1><p class="lead">表示された単語が歌詞に入っている曲を、先に歌い始めよう。</p><div class="eras"><button class="era active" data-era="all">全年代</button><button class="era" data-era="80s">80s</button><button class="era" data-era="90s">90s</button><button class="era" data-era="00s">00s</button><button class="era" data-era="10s">10s</button><button class="era" data-era="20s">20s</button></div><div class="word-wrap"><div class="word" id="word">お題を<br>生成しよう！</div></div><button class="btn" id="generateBtn">単語を生成する</button><p class="small" id="eraLabel">全年代モード</p><a class="back" href="../">← ゲーム一覧に戻る</a></section></div></main><script>(function(){var pools={all:['愛','夢','夜','朝','空','海','雨','雪','風','星','月','太陽','光','影','声','涙','笑顔','心','恋','好き','君','僕','私','世界','未来','過去','今日','明日','昨日','春','夏','秋','冬','花','桜','道','街','駅','電車','車','家','部屋','窓','ドア','手','指','目','髪','名前','時間','時計','電話','写真','手紙','言葉','秘密','約束','キス','会いたい','さよなら','ありがとう','ごめん','帰る','走る','歩く','飛ぶ','踊る','歌う','眠る','笑う','泣く','待つ','探す','忘れる','赤','青','白','黒','虹','雲','波','川','山','森','火','水','音','季節','運命','自由','希望','奇跡','幸せ','寂しい','優しい','強い','弱い','遠い','近い','永遠','一瞬'], '80s':['愛','恋','夢','夜','都会','街','電話','手紙','窓','雨','海','夏','涙','別れ','あなた','心','青春','駅','風','星','ダンス','夜明け','秘密','約束','時計','季節','未来','思い出','さよなら','抱きしめて'], '90s':['恋','愛','君','僕','夢','未来','世界','涙','笑顔','心','夜','朝','街','駅','電話','写真','夏','冬','桜','海','空','風','約束','会いたい','強く','優しく','永遠','奇跡','自由','希望'], '00s':['君','僕','私','愛','恋','好き','空','星','月','光','未来','世界','夢','涙','笑顔','心','メール','携帯','写真','桜','夏','冬','会いたい','ありがとう','さよなら','運命','奇跡','永遠','一瞬','声'], '10s':['君','僕','私','好き','愛','恋','世界','未来','今日','明日','夜','朝','空','星','光','声','言葉','笑顔','涙','写真','SNS','イヤホン','街','電車','会いたい','ありがとう','運命','自由','希望','奇跡'], '20s':['君','僕','私','好き','愛','恋','夜','朝','世界','未来','今','今日','明日','声','言葉','心','距離','画面','通知','写真','夢','空','月','星','光','会いたい','幸せ','寂しい','運命','一瞬']};var era='all',last=-1,n=0;function pick(){var words=pools[era],i;do{i=Math.floor(Math.random()*words.length)}while(i===last&&words.length>1);last=i;n++;document.getElementById('word').textContent=words[i];document.getElementById('countLabel').textContent='Q'+n}document.getElementById('generateBtn').onclick=pick;document.querySelectorAll('.era').forEach(function(btn){btn.onclick=function(){document.querySelectorAll('.era').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');era=btn.dataset.era;last=-1;n=0;document.getElementById('countLabel').textContent='START';document.getElementById('word').innerHTML='お題を<br>生成しよう！';document.getElementById('eraLabel').textContent=btn.textContent+'モード'}})})();</script></body></html>
